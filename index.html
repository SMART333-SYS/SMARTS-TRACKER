    <script>
      (function() {
        // 1. Suppress console.error/warn for Vite HMR WebSocket in preview iframe
        var origConsoleError = console.error;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).map(function(arg) {
            return String(arg && arg.message ? arg.message : arg);
          }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('vite-hmr') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Intercept native WebSocket for 'vite-hmr' subprotocol
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr') isHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1)) isHmr = true;

            if (isHmr) {
              var listeners = { open: [], message: [], close: [], error: [] };
              var dummy = {
                readyState: 1, // OPEN
                url: url,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(evt, fn) {
                  if (listeners[evt]) listeners[evt].push(fn);
                  if (evt === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(evt, fn) {
                  if (listeners[evt]) {
                    listeners[evt] = listeners[evt].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        // 3. Catch window unhandled errors and rejections
        window.addEventListener('unhandledrejection', function(e) {
          var msg = String(e && e.reason && e.reason.message ? e.reason.message : e.reason);
          if (msg.indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          var msg = String(e && e.message ? e.message : '');
          if (msg.indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
