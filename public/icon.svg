<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Background with Safe Zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Central Emblem: Sprout + Moon Crescent + Star / Strength symbol -->
  <g filter="url(#glow)">
    <!-- Crescent Moon Curve representing Roohani / Islamic routine -->
    <path d="M 280 120 A 136 136 0 1 0 380 320 A 160 160 0 0 1 280 120 Z" fill="#ffffff" />
    
    <!-- Sprout / Fitness Flame inside -->
    <path d="M 230 360 C 210 320 220 270 260 230 C 270 270 290 295 285 340 C 265 370 245 370 230 360 Z" fill="url(#accentGrad)" />
    <path d="M 260 230 C 285 190 320 180 345 175 C 340 210 320 240 280 260 Z" fill="#fef08a" />
    
    <!-- Star accent -->
    <polygon points="340,135 346,149 361,150 349,160 353,174 340,165 327,174 331,160 319,150 334,149" fill="#facc15" />
  </g>
  
  <!-- Subtle branding text: SAMROOT -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ecfdf5" text-anchor="middle" letter-spacing="4">SAMROOT</text>
</svg>
